# Same-origin API proxy: /api/<path>?<query> -> $api_upstream/<path>?<query>
# (included from default.conf; $api_upstream comes from API_UPSTREAM). The path and query are
# forwarded byte for byte as the browser sent them ($request_uri minus "/api"), like the
# Cloudflare Pages function does.
if ($api_upstream = "") {
    return 502;
}
proxy_pass $api_upstream$ruidea_api_path;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host = the API's own host name (Azure routes on it); Origin, Cookie and X-CSRF-Token are passed
# through unchanged, and Set-Cookie comes back unchanged (host-only cookie, so it is scoped to
# this site).
proxy_set_header Host $proxy_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_ssl_server_name on;
proxy_ssl_name $proxy_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
# Uploads: up to 10 files of 10 MB (backend limits). Passport PDF/JPEG rendering can be slow.
client_max_body_size 105m;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
